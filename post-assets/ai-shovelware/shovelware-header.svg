<!-- Custom CSS for animation -->
<style>
@keyframes dig {
 0% {
    transform: translate(0, 0);
 }

 /* float up slowly, then quickly strike down */
 50% { transform: translate(140px, -140px); }
 60% { transform: translate(140px, -140px); }
 68% { transform: translate(5px, -5px); }
 70% { transform: translate(0, 0); }

 100% {
    transform: translate(0, 0);
 }
}

#Shovel, #Shovel_2, #Shovel_3, #Shovel_4 {
    transform-origin: center;
    animation: dig 3s infinite;
}
#Shovel_2 { animation-delay: 0.25s; }
#Shovel_3 { animation-delay: 0.5s; }
#Shovel_4 { animation-delay: 1s; }
</style>

