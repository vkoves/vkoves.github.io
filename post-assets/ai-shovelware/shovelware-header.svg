<svg width="2000" height="450" viewBox="0 0 2000 450" fill="none" xmlns="http://www.w3.org/2000/svg">

<!-- Custom CSS for animation -->
<style>
@keyframes dig {
 0% {
    transform: translate(0, 0);
 }

 /* float up slowly, then quickly strike down */
 30% { transform: translate(140px, -140px); }
 65% { transform: translate(140px, -140px); }
 68% { transform: translate(5px, -5px); }
 70% { transform: translate(0, 0); }

 100% {
    transform: translate(0, 0);
 }
}

#Shovel, #Shovel_2, #Shovel_3, #Shovel_4 {
  transform-origin: center;
  animation: dig 3s infinite;
}

/* match shovel key frame but show dirt mark right before impact to make it slide into dirt */
@keyframes dirt {
   /** fade out slowly during float up */
   0% { opacity: 1; }
   20% { opacity: 1; }
   40% { opacity: 0; }

   65% { opacity: 0; }
   66% { opacity: 1; }

   100% { opacity: 1; }
}

#ShovelDirt, #ShovelDirt_2, #ShovelDirt_3, #ShovelDirt_4 {
  animation: dirt 3s infinite;
}

/** delay shovel and dirt animations to stagger them */
#Shovel_2, #ShovelDirt_2 { animation-delay: 0.3s; }
#Shovel_3, #ShovelDirt_3 { animation-delay: 0.8s; }
#Shovel_4, #ShovelDirt_4 { animation-delay: 1.3s; }
</style>

